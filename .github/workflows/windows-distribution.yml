name: Windows x64 distribution and installed runtime
on:
  workflow_dispatch:
  push:
    branches: [arena/04806916-garageflows-contract-generator]
    paths-ignore: ['**.md']
concurrency:
  group: windows-distribution-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: node --version; npm --version
      - run: npm install
      - run: npm run verify:config
      - run: npm run typecheck
      - run: npm run build:renderer
      - run: npm run build:electron
      - run: npm run build:branding
      - run: npm run build:examples
      - run: node scripts/prepare-dist.mjs
      - run: npm run dist
      - name: Record native installer metadata
        run: |
          $file = Get-Item 'dist/GarageFlows-Contract-Generator-Setup.exe'
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash
          Write-Output "::notice title=Windows installer::$($file.Length) bytes; SHA256=$hash; Windows x64"
      - run: npm run lint
      - run: npm test
      - run: npm run test:runtime
      - id: browser
        run: npx playwright install chromium
      - run: npm run test:ui -- --reporter=list,github
      - run: npm run test:installed
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-x64-installer-and-proof
          path: |
            dist/GarageFlows-Contract-Generator-Setup.exe
            test-results/
            playwright-report/
          retention-days: 7
