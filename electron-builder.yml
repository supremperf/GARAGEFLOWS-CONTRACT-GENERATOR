appId: com.garageflows.contractgenerator
productName: GarageFlows Contract Generator
copyright: Copyright © 2026 GarageFlows
electronVersion: "28.3.3"
electronDist: node_modules/@assistant-ai/electron-win32-x64/dist
directories:
  output: dist
  buildResources: public/branding
files:
  - dist-electron/**/*
  - dist-renderer/**/*
  - examples/**/*
  - README_MODELES_CONTRATS.md
  - package.json
afterPack: scripts/after-pack.cjs
extraResources:
  - from: public/branding
    to: branding
  - from: examples
    to: examples
  - from: README_MODELES_CONTRATS.md
    to: README_MODELES_CONTRATS.md
  - from: resources/tessdata
    to: tessdata
win:
  target:
    - target: nsis
      arch:
        - x64
  # Icône d'application multi-résolutions (scripts/generate-icon.mjs).
  icon: public/branding/icon.ico
  # Native resource editing on Windows; afterPack supplies identical resources
  # for cross-builds without Wine. This is not an Authenticode signature.
  signExecutable: false
nsis:
  installerIcon: public/branding/icon.ico
  installerHeaderIcon: public/branding/icon.ico
  uninstallerIcon: public/branding/icon.ico
  oneClick: false
  perMachine: false
  deleteAppDataOnUninstall: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "GarageFlows Contract Generator"
  artifactName: "GarageFlows-Contract-Generator-Setup.exe"
asar: true
asarUnpack:
  - "**/*.node"
  - "**/node_modules/canvas/**/*"
  - "**/node_modules/tesseract.js/**/*"
  - "**/node_modules/tesseract.js-core/**/*"
  - "**/node_modules/sql.js/dist/*.wasm"
  - "**/node_modules/pdfjs-dist/**/*"
